name: Ping Supabase Keep Alive
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Database
        run: |
          curl -f -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/listings?select=id&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
